name: karobar
description: "کاروبار — AI-powered billing, inventory and accounting for small businesses."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Local storage / offline
  drift: ^2.22.1
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.2
  shimmer: ^3.0.0

  # Device features
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.16.0
  mobile_scanner: ^7.4.0
  speech_to_text: ^7.0.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.20.2 # pinned by flutter_localizations
  uuid: ^4.5.1
  collection: ^1.18.0
  google_sign_in: ^7.2.0
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.1
  barcode: ^2.2.9
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
