<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Karobar — billing, stock and khata for Pakistani shops. Works without internet.">
  <meta name="theme-color" content="#F97316">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Karobar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Karobar — کاروبار</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      The app is a few megabytes and a shop's connection is often a bar of 3G.
      Flutter paints nothing until it has all of it, so without this the
      shopkeeper watches a white screen and decides the link is broken. This is
      the same orange and the same Urdu name they see in the app itself, so the
      wait looks like the app starting rather than a page failing.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FFF7ED;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #FFF7ED;
      /* Above the canvas until the first frame, then faded out and removed. */
      z-index: 9999;
      transition: opacity .35s ease;
    }

    #boot .mark {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #F97316, #C2410C);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 34px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(249, 115, 22, .32);
    }

    #boot .name {
      font-size: 19px;
      font-weight: 700;
      color: #7C2D12;
      letter-spacing: .2px;
    }

    #boot .hint {
      font-size: 13px;
      color: #9A3412;
      opacity: .75;
    }

    #boot .bar {
      width: 132px;
      height: 3px;
      border-radius: 3px;
      background: #FDBA74;
      overflow: hidden;
    }

    #boot .bar i {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #F97316;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }

    @media (prefers-color-scheme: dark) {
      html, body, #boot { background: #1C1917; }
      #boot .name { color: #FED7AA; }
      #boot .hint { color: #FDBA74; }
      #boot .bar  { background: #44403C; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">کا</div>
    <div class="name">Karobar — کاروبار</div>
    <div class="bar"><i></i></div>
    <div class="hint">Loading…</div>
  </div>

  <script>
    // Removed on the first painted frame rather than after a fixed delay: on a
    // slow connection a timer would uncover a blank canvas, and on a fast one
    // it would sit on top of a ready app.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 400);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
